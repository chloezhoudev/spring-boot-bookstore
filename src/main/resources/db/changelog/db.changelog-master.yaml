databaseChangeLog:
  - changeSet:
      id: 1
      author: chloe
      changes:
        - createTable:
            tableName: book
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: varchar(255)
              - column:
                  name: author
                  type: varchar(255)
              - column:
                  name: price
                  type: double
  - changeSet:
      id: 2
      author: chloe
      changes:
        - addColumn:
            tableName: book
            columns:
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: updated_at
                  type: timestamp
  - changeSet:
      id: 3
      author: chloe
      changes:
        - addColumn:
            tableName: book
            columns:
              - column:
                  name: category
                  type: varchar(50)